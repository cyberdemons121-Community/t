services:
  - type: web
    name: cyberdemons
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: ADMIN_EMAIL
        value: cyberdemons121@gmail.com
      - key: APP_URL
        sync: false
      - key: FROM_EMAIL
        value: cyberdemons121@gmail.com
      - key: SMTP_EMAIL
        value: cyberdemons121@gmail.com
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USER
        value: cyberdemonadmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
